; ESP32-C3 Super Mini NeoTrellis Box — PlatformIO Configuration
;
; https://docs.platformio.org/page/projectconf.html

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; --- Libraries ---
lib_deps =
    adafruit/Adafruit seesaw Library
    knolleary/PubSubClient
    bblanchon/ArduinoJson

; --- Build flags ---
build_flags =
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=3

; --- Upload ---
upload_speed = 921600

; --- File system (for web UI assets) ---
board_build.filesystem = littlefs
